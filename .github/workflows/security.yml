name: Security

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1' # weekly, so new advisories surface without a push
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans full history
          persist-credentials: false
          submodules: true
      # Installs the scanner versions pinned in mise.toml, same as local `mise run security`
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: mise run security
