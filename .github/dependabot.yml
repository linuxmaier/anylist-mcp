version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Ranges for anylist-js deps must match the submodule (scripts/check-submodule-deps.mjs),
    # so only refresh the lockfile; range bumps are done by hand.
    versioning-strategy: lockfile-only
    groups:
      npm:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  # The hosted image's base (docker/hosted.Dockerfile), pinned by digest
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
